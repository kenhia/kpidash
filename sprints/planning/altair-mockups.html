<title>Altair Panel Mock-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #11111b; --panel: #1e1e2e; --line: #313244;
    --fg: #cdd6f4; --dim: #a6adc8; --faint: #6c7086; --accent: #fab387;
  }
  body {
    background: var(--bg); color: var(--fg);
    font-family: Montserrat, "Segoe UI", system-ui, sans-serif; font-size: 15px;
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
  p.note { color: var(--dim); margin: 0 0 16px; max-width: 70ch; line-height: 1.5; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 16px; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--faint); min-width: 0; }
  select, input[type=range] { font: inherit; font-size: 14px; color: var(--fg);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input[type=range] { padding: 0; width: 150px; accent-color: var(--accent); height: 34px; }
  .stage { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #181825; }
  canvas { display: block; }
  .readout { color: var(--dim); margin-top: 10px; font-variant-numeric: tabular-nums; }
  .readout b { color: var(--fg); font-weight: 600; }
</style>

<h1>Altair 8800 front panel, for the space after the status cards</h1>
<p class="note">The strip below is the bottom 276 pixels of the 3840-wide panel at real size. The lamps are driven by a small 8080 emulator running the program you pick; each lamp's brightness is how long its line was high since the last redraw.</p>

<div class="controls">
  <label>Status cards <select id="n"></select></label>
  <label>Program <select id="prog">
    <option value="ktb-auto">Kill the Bit, auto-player</option>
    <option value="ktb">Kill the Bit, nobody playing</option>
    <option value="count">Address counter</option>
  </select></label>
  <label>Pattern speed <select id="speed">
    <option value="1">real 2 MHz</option>
    <option value="0.225" selected>slow (about 2 steps/s)</option>
    <option value="0.112">slower (about 1 step/s)</option>
    <option value="0.056">slowest (about 1 step per 2 s)</option>
  </select></label>
  <label>Redraws per second <select id="rate">
    <option>2</option><option>5</option><option selected>10</option><option>30</option>
  </select></label>
  <label>Brightness levels <select id="levels">
    <option>2</option><option>4</option><option selected>8</option><option>16</option>
  </select></label>
  <label>Max brightness <input id="maxb" type="range" min="15" max="100" value="65"></label>
  <label>Lamp colour <select id="colour">
    <option value="#f38ba8">Mocha red</option>
    <option value="#ff4a3d">LED red</option>
    <option value="#fab387">Peach</option>
    <option value="#f9e2af">Amber</option>
    <option value="#a6e3a1">Green</option>
  </select></label>
  <label>Panel <select id="skin">
    <option value="mocha">Mocha card</option>
    <option value="altair">Altair blue</option>
  </select></label>
  <label>View at <select id="scale">
    <option value="0.5" selected>50% (as from the chair)</option>
    <option value="1">100% (real pixels)</option>
  </select></label>
</div>

<div class="stage"><canvas id="c" width="3840" height="276"></canvas></div>
<div class="readout" id="readout"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const cv = $('c'), g = cv.getContext('2d');
  const W = 3840, H = 276, CARD_W = 220, CARD_H = 240, PITCH = 228, BAR_X = 30, BAR_Y = 18;

  const nSel = $('n');
  for (let i = 6; i <= 15; i++) nSel.add(new Option(i + (i === 12 ? ' (today)' : ''), i, i === 12, i === 12));
  const q = new URLSearchParams(location.search);
  for (const [k, v] of q) if ($(k)) $(k).value = v;

  // ---- a very small 8080: only the opcodes these programs use ----
  // Lamps: 0-15 address, 16-23 data, 24-33 status (INTE PROT MEMR INP M1 OUT HLTA STACK WO INT), 34 WAIT, 35 HLDA
  const ST = { INTE: 24, PROT: 25, MEMR: 26, INP: 27, M1: 28, OUT: 29, HLTA: 30, STACK: 31, WO: 32, INT: 33 };
  const PROGS = {
    ktb: [0x21,0,0, 0x16,0x80, 0x01,0x0e,0, 0x1a,0x1a,0x1a,0x1a, 0x09, 0xd2,0x08,0, 0xdb,0xff, 0xaa, 0x0f, 0x57, 0xc3,0x08,0],
    count: [0x21,0,0, 0x23, 0x7e, 0xc3,0x03,0],
  };
  let mem, r, on, total, auto, pressAt, emuT;
  function reset() {
    const name = $('prog').value;
    mem = new Uint8Array(65536);
    mem.set(PROGS[name === 'count' ? 'count' : 'ktb']);
    r = { pc: 0, a: 0, b: 0, c: 0, d: 0, e: 0, h: 0, l: 0, cy: 0 };
    on = new Float64Array(36); total = 0; emuT = 0;
    auto = name === 'ktb-auto'; pressAt = 2e6 * 2;
  }
  function cyc(addr, data, m1, memr, inp, t) {
    for (let i = 0; i < 16; i++) if (addr >> i & 1) on[i] += t;
    for (let i = 0; i < 8; i++) if (data >> i & 1) on[16 + i] += t;
    if (m1) on[ST.M1] += t; if (memr) on[ST.MEMR] += t; if (inp) on[ST.INP] += t;
    on[ST.WO] += t; total += t; emuT += t;
  }
  const fetch = (t) => { const op = mem[r.pc]; cyc(r.pc, op, 1, 1, 0, t); r.pc = r.pc + 1 & 0xffff; return op; };
  const imm = () => { const v = mem[r.pc]; cyc(r.pc, v, 0, 1, 0, 3); r.pc = r.pc + 1 & 0xffff; return v; };
  function senseSwitches() {
    if (!auto || emuT < pressAt) return 0;
    pressAt = emuT + 2e6 * (1.5 + Math.random() * 3);     // next press, in emulated T-states
    const lit = []; for (let i = 0; i < 8; i++) if (r.d >> i & 1) lit.push(i);
    const hit = lit.length > 3 || (lit.length > 0 && Math.random() < 0.5);
    // the bit is rotated right once after the compare, so a hit must name the lit position itself
    return 1 << (hit ? lit[Math.random() * lit.length | 0] : Math.random() * 8 | 0);
  }
  function step() {
    const pc0 = r.pc, op = fetch(op4(pc0));
    switch (op) {
      case 0x21: r.l = imm(); r.h = imm(); break;                       // LXI H
      case 0x01: r.c = imm(); r.b = imm(); break;                       // LXI B
      case 0x16: r.d = imm(); break;                                    // MVI D
      case 0x1a: { const ad = r.d << 8 | r.e; r.a = mem[ad]; cyc(ad, r.a, 0, 1, 0, 3); break; } // LDAX D
      case 0x09: { const s = (r.h << 8 | r.l) + (r.b << 8 | r.c); r.cy = s > 0xffff ? 1 : 0;
                   r.h = s >> 8 & 255; r.l = s & 255; cyc(r.pc, 0, 0, 0, 0, 6); break; }         // DAD B
      case 0xd2: { const lo = imm(), hi = imm(); if (!r.cy) r.pc = hi << 8 | lo; break; }        // JNC
      case 0xc3: { const lo = imm(), hi = imm(); r.pc = hi << 8 | lo; break; }                   // JMP
      case 0xdb: { const p = imm(); r.a = senseSwitches(); cyc(p << 8 | p, r.a, 0, 0, 1, 3); break; } // IN
      case 0xaa: r.a ^= r.d; r.cy = 0; break;                           // XRA D
      case 0x0f: r.cy = r.a & 1; r.a = (r.a >> 1 | r.cy << 7) & 255; break; // RRC
      case 0x57: r.d = r.a; break;                                      // MOV D,A
      case 0x23: { const v = (r.h << 8 | r.l) + 1 & 0xffff; r.h = v >> 8; r.l = v & 255; break; } // INX H
      case 0x7e: { const ad = r.h << 8 | r.l; r.a = mem[ad]; cyc(ad, r.a, 0, 1, 0, 3); break; }   // MOV A,M
      default: r.pc = 0;
    }
  }
  const op4 = (pc) => (mem[pc] === 0x57 || mem[pc] === 0x23) ? 5 : 4;   // MOV r,r and INX take 5 T-states

  // ---- drawing ----
  const mix = (a, b, t) => {
    const p = (h, i) => parseInt(h.slice(1 + i * 2, 3 + i * 2), 16);
    return '#' + [0, 1, 2].map(i => Math.round(p(a, i) + (p(b, i) - p(a, i)) * t).toString(16).padStart(2, '0')).join('');
  };
  const SKINS = {
    mocha:  { panel: '#1e1e2e', label: '#a6adc8', name: '#6c7086' },
    altair: { panel: '#22354d', label: '#cdd6f4', name: '#8fa3bd' },
  };
  const STATUS_NAMES = ['INTE', 'PROT', 'MEMR', 'INP', 'M1', 'OUT', 'HLTA', 'STACK', 'WO', 'INT'];
  const ADDR_U = [3, 4.5, 5.5, 6.5, 8, 9, 10, 11.5, 12.5, 13.5, 15, 16, 17, 18.5, 19.5, 20.5]; // A15..A0, in pitches

  function layout(n) {
    const x0 = BAR_X + n * PITCH, x1 = W - 30, w = x1 - x0, pad = 22, inner = w - pad * 2;
    let mode = 'full', units = 21.5;
    if (inner / units < 26) { mode = 'compact'; units = 18.5; }
    if (inner / units < 14 || w < 240) return { mode: 'none', x0, w };
    const p = Math.min(inner / units, 110), lw = Math.round(p * 0.64);
    const left = x0 + pad + (inner - p * units) / 2, shift = mode === 'full' ? 0 : 3;
    const lx = (u) => Math.round(left + (u - shift) * p + (p - lw) / 2);
    const lamps = [];
    ADDR_U.forEach((u, i) => lamps.push({ id: 15 - i, x: lx(u), row: 1, name: 'A' + (15 - i) }));
    ADDR_U.slice(8).forEach((u, i) => lamps.push({ id: 16 + 7 - i, x: lx(u), row: 0, name: 'D' + (7 - i) }));
    if (mode === 'full') {
      STATUS_NAMES.forEach((nm, i) => lamps.push({ id: 24 + i, x: lx(i), row: 0, name: nm }));
      lamps.push({ id: 34, x: lx(0), row: 1, name: 'WAIT' }, { id: 35, x: lx(1), row: 1, name: 'HLDA' });
    }
    return { mode, x0, w, p, lw, lamps, lx, perLamp: p >= 88 };
  }

  function drawStatic(L, skin) {
    g.fillStyle = '#181825'; g.fillRect(0, 0, W, H);
    const n = +nSel.value;
    for (let i = 0; i < n; i++) {
      const x = BAR_X + i * PITCH;
      g.fillStyle = '#1e1e2e'; g.strokeStyle = i % 4 === 3 ? '#8a5f2b' : '#2f6b33'; g.lineWidth = 6;
      g.beginPath(); g.roundRect(x + 3, BAR_Y + 3, CARD_W - 6, CARD_H - 6, 8); g.fill(); g.stroke();
      g.fillStyle = '#585b70'; g.font = '600 22px Montserrat, sans-serif'; g.textAlign = 'center';
      g.fillText('status', x + CARD_W / 2, BAR_Y + CARD_H / 2 + 8);
    }
    if (L.mode === 'none') return;
    g.fillStyle = skin.panel; g.beginPath(); g.roundRect(L.x0, BAR_Y, L.w, CARD_H, 12); g.fill();
    g.textBaseline = 'alphabetic';
    const y = [BAR_Y + 32, BAR_Y + 140];                 // label baselines for the two rows
    if (L.perLamp) {
      g.font = '600 20px Montserrat, sans-serif'; g.textAlign = 'center'; g.fillStyle = skin.label;
      for (const l of L.lamps) g.fillText(l.name, l.x + L.lw / 2, y[l.row]);
      g.font = '700 22px Montserrat, sans-serif'; g.fillStyle = skin.name;
      if (L.mode === 'full') g.fillText('ALTAIR 8800', (L.lx(10) + L.lx(12.5)) / 2, BAR_Y + 84);
    } else {
      g.font = '600 20px Montserrat, sans-serif'; g.textAlign = 'left'; g.fillStyle = skin.label;
      const shift = L.mode === 'full' ? 0 : 3;
      g.fillText('DATA', L.lx(12.5), y[0]);
      g.fillText('ADDRESS', L.lx(3), y[1]);
      if (L.mode === 'full') {
        g.fillText('STATUS', L.lx(0), y[0]);
        g.font = '700 20px Montserrat, sans-serif'; g.fillStyle = skin.name; g.fillText('8800', L.lx(0), y[1]);
      } else {
        g.font = '700 20px Montserrat, sans-serif'; g.fillStyle = skin.name; g.fillText('ALTAIR 8800', L.lx(3), y[0]);
      }
    }
  }
  const LAMP_Y = [BAR_Y + 46, BAR_Y + 154], LAMP_H = 62;
  let shown = new Int8Array(36).fill(-1), L, skin, palette = [], lastFrac = new Float64Array(36);
  function setup() {
    L = layout(+nSel.value); skin = SKINS[$('skin').value];
    const levels = +$('levels').value, full = $('colour').value, off = mix(skin.panel, full, 0.10);
    const top = mix(off, full, +$('maxb').value / 100);
    palette = Array.from({ length: levels }, (_, i) => mix(off, top, i / (levels - 1)));
    shown.fill(-1); drawStatic(L, skin); paint(lastFrac);
    cv.style.width = W * +$('scale').value + 'px';
    const free = L.w;
    $('readout').innerHTML = L.mode === 'none'
      ? `Free width <b>${free} px</b>: too narrow, nothing is drawn.`
      : `Free width <b>${free} px</b> · lamp <b>${L.lw} px</b> wide on a <b>${Math.round(L.p)} px</b> pitch · ` +
        `<b>${L.mode === 'full' ? '36 lamps' : '24 lamps (status row dropped)'}</b> · ` +
        `labels <b>${L.perLamp ? 'per lamp' : 'per group'}</b>`;
  }
  function paint(frac) {
    if (L.mode === 'none') return;
    const n = palette.length;
    for (const l of L.lamps) {
      const lv = Math.min(n - 1, Math.round(frac[l.id] * (n - 1)));
      if (shown[l.id] === lv) continue;                  // redraw only lamps whose level changed
      shown[l.id] = lv; g.fillStyle = palette[lv];
      g.beginPath(); g.roundRect(l.x, LAMP_Y[l.row], L.lw, LAMP_H, 5); g.fill();
    }
  }

  let last = 0, carry = 0;
  function tick(ts) {
    const period = 1000 / +$('rate').value;
    if (!last) last = ts;
    if (ts - last >= period) {
      const budget = Math.min((ts - last) / 1000, 0.6) * 2e6 * +$('speed').value + carry;
      on.fill(0); total = 0;
      while (total < budget) step();
      carry = budget - total;
      const frac = new Float64Array(36);
      for (let i = 0; i < 36; i++) frac[i] = total ? on[i] / total : 0;
      lastFrac = frac; paint(frac); last = ts;
    }
    requestAnimationFrame(tick);
  }

  for (const id of ['n', 'levels', 'maxb', 'colour', 'skin', 'scale']) $(id).addEventListener('input', setup);
  $('prog').addEventListener('input', () => { reset(); setup(); });
  reset(); setup();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(setup);
  requestAnimationFrame(tick);
})();
</script>
